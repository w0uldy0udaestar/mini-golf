<!doctype html>
<!--
  mini-golf 15s — 컨셉 시안 스틸 (1단계). 해시로 장면 선택: #A-h #A-v #B-h #B-v #C-h #C-v
  렌더: ../scripts/render-stills.sh (헤드리스 Chrome → dist/ads/concepts/)
  좌표계: #desk = 가짜 데스크탑 1920×1080pt. 게임 캡처(dist/cap/ad, 3840×2160 알파 PNG)는 #game에 1:1로 깔린다 → 게임 좌표 그대로.
  카메라 = #desk의 translate + scale 뿐 (회전·원근 없음 — clean-motion-rules ★).
  색: 게임 팔레트 그대로 — 선화 흰색, 지형 회색 계조, 포인트 컬러는 깃발 레드 하나(#D94D3D).
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:"Pretendard"; src:url("../brand/fonts/Pretendard-Light.woff2") format("woff2"); font-weight:300; font-display:block; }
  @font-face { font-family:"Pretendard"; src:url("../brand/fonts/Pretendard-Regular.woff2") format("woff2"); font-weight:400; font-display:block; }
  @font-face { font-family:"Pretendard"; src:url("../brand/fonts/Pretendard-Medium.woff2") format("woff2"); font-weight:500; font-display:block; }
  @font-face { font-family:"Pretendard"; src:url("../brand/fonts/Pretendard-SemiBold.woff2") format("woff2"); font-weight:600; font-display:block; }
  @font-face { font-family:"Pretendard"; src:url("../brand/fonts/Pretendard-Bold.woff2") format("woff2"); font-weight:700; font-display:block; }
  @font-face { font-family:"Pretendard"; src:url("../brand/fonts/Pretendard-ExtraBold.woff2") format("woff2"); font-weight:800; font-display:block; }
  @font-face { font-family:"JBM"; src:url("../brand/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); font-weight:400; font-display:block; }
  @font-face { font-family:"JBM"; src:url("../brand/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); font-weight:500; font-display:block; }
  :root {
    --wall:#101113; --wall2:#0C0D0E;
    --win:#1A1B1E; --win-bar:#222327; --win-line:#2E2F34; --win-text:#B7B8B3; --win-dim:#6C6D70;
    --ink:#F4F4F1; --ink2:#8E8F8B; --ink3:#5C5D5B;
    --red:#D94D3D;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:#000; overflow:hidden; }
  #root { position:relative; overflow:hidden; background:var(--wall2); font-family:"Pretendard", sans-serif; color:var(--ink); }
  #root.h { width:1920px; height:1080px; }
  #root.v { width:1080px; height:1920px; }

  /* ── 가짜 데스크탑 (pt) ── */
  #desk { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0;
    background:radial-gradient(120% 90% at 30% 20%, #16171A 0%, var(--wall) 55%, var(--wall2) 100%); overflow:hidden; }
  .menubar { position:absolute; left:0; top:0; width:1920px; height:28px; background:rgba(22,23,25,.92); border-bottom:1px solid #202124;
    display:flex; align-items:center; gap:22px; padding:0 18px; font-size:13.5px; font-weight:500; color:#C9CAC6; letter-spacing:.1px; }
  .menubar .app { font-weight:700; color:#E6E6E2; }
  .menubar .sp { flex:1; }
  .menubar .clock { font-variant-numeric:tabular-nums; }
  .flagicon { width:14px; height:16px; display:inline-block; vertical-align:-2px; }
  .win { position:absolute; background:var(--win); border-radius:11px; overflow:hidden;
    box-shadow:0 0 0 1px #2A2B30, 0 18px 50px rgba(0,0,0,.55), 0 4px 12px rgba(0,0,0,.35); }
  .win .bar { height:34px; background:var(--win-bar); border-bottom:1px solid var(--win-line); display:flex; align-items:center; padding:0 13px; gap:8px; }
  .win .bar i { width:12px; height:12px; border-radius:50%; background:#3A3B40; display:block; }
  .win .bar .t { flex:1; text-align:center; font-size:13px; font-weight:500; color:#8C8D8A; margin-right:52px; }
  .win.dim { filter:brightness(.5); }
  .win .body { position:absolute; top:34px; left:0; right:0; bottom:0; overflow:hidden; }
  /* 에디터 */
  .code { font-family:"JBM", monospace; font-variant-ligatures:none; font-size:16.5px; line-height:27px; color:#595A56; padding:16px 0 0 0; white-space:pre; }
  .code .ln { display:inline-block; width:58px; text-align:right; padding-right:20px; color:#4B4C50; }
  .code .k { color:#7E7F7A; font-weight:500; }
  .code .c { color:#3D3E41; }
  .code .n { color:#766D60; }
  .code .cur { background:#222328; display:block; color:#8A8B86; }
  .caret { display:inline-block; width:2px; height:1.05em; background:#EDEDE8; vertical-align:-3px; margin-left:1px; }
  /* 문서 */
  .doc { padding:34px 44px; color:#7E7F7B; }
  .doc h3 { font-size:26px; font-weight:700; color:#A9AAA5; margin-bottom:6px; letter-spacing:-.3px; }
  .doc .meta { font-size:13px; color:var(--win-dim); margin-bottom:24px; }
  .doc p, .doc li { font-size:16px; line-height:1.75; }
  .doc ul { list-style:none; margin-top:8px; }
  .doc li::before { content:"—  "; color:#55565A; }
  /* 채팅 */
  .chat { padding:16px 18px; font-size:14.5px; line-height:1.5; color:var(--win-text); }
  .chat .m { margin-bottom:13px; }
  .chat .who { font-weight:700; color:#DADAD5; font-size:13.5px; }
  .chat .who span { font-weight:400; color:var(--win-dim); margin-left:6px; }
  /* 게임 오버레이 (캡처) */
  .g { position:absolute; left:0; top:0; width:1920px; height:1080px; }
  .gcrop { position:absolute; }
  .cursor { position:absolute; width:22px; height:32px; }

  /* ── 타이포 (화면 고정층) ── */
  .type { position:absolute; }
  .kicker { font-size:26px; font-weight:600; color:var(--ink2); letter-spacing:-.2px; }
  .head { font-weight:700; letter-spacing:-1.6px; line-height:1.14; color:var(--ink); }
  .dash { width:56px; height:5px; background:var(--red); border-radius:3px; }
  .wordmark { font-weight:800; letter-spacing:-2.4px; color:var(--ink); line-height:1; }
  .sub { font-size:22px; font-weight:500; color:var(--ink2); letter-spacing:.2px; }
  .bezel { position:absolute; left:0; right:0; background:#050506; }
  .scrim { position:absolute; left:0; right:0; pointer-events:none; }
  .label-safe { display:none; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const CAP = "../assets/cap/";
const FLAG = `<svg class="flagicon" viewBox="0 0 14 16"><line x1="3" y1="1" x2="3" y2="15" stroke="#E6E6E2" stroke-width="1.6" stroke-linecap="round"/><path d="M3.8 1.6 L12.5 4.4 L3.8 7.2 Z" fill="#D94D3D"/></svg>`;
const CURSOR = `<svg class="cursor" viewBox="0 0 22 32"><path d="M2 2 L2 25 L7.6 19.8 L11.4 28.6 L15 27 L11.3 18.4 L18.8 18.4 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`;

// Ballistics.swift 실제 발췌 (공개 저장소) — 에디터 창 내용
const SWIFT = [
  ['c', '    /// 결정론적 물리 스텝. 경사면 바운스는 법선 반사, 굴림에는 중력의 경사 성분이 더해진다.'],
  ['', '    <k>public static func</k> step('],
  ['', '        _ b: <k>inout</k> BallState, hole: Hole, dt: Double = Phys.dt, wind: Double? = <k>nil</k>,'],
  ['', '        kind: BallKind = .standard'],
  ['', '    ) -> StepEvent {'],
  ['', '        <k>switch</k> b.phase {'],
  ['', '        <k>case</k> .fly:'],
  ['c', '            // 바람: 공기력은 대기 상대속도 기준 — 뒷바람은 항력을 줄이고 맞바람은 키운다'],
  ['', '            <k>let</k> rvx = b.vx - (wind ?? hole.wind)'],
  ['', '            <k>let</k> v = max(hypot(rvx, b.vy), <n>1e-9</n>)'],
  ['', '            <k>let</k> omega = b.spin * <n>2</n> * .pi / <n>60</n>'],
  ['', '            <k>let</k> spinRatio = min(Phys.ballRadius * omega / v, Phys.spinRatioMax)'],
  ['', '            <k>let</k> cl = min(Phys.clMax, Phys.clBase + Phys.clSlope * spinRatio)'],
  ['c', '            // 항력(상대속도 반대) + 마그누스 양력(상대속도 수직, 백스핀=위) + 중력'],
  ['', '            <k>let</k> ax = -q * Phys.cd * v * rvx + q * cl * v * -b.vy * b.spinSign'],
  ['', '            <k>let</k> ay = -Phys.g - q * Phys.cd * v * b.vy + q * cl * v * rvx * b.spinSign'],
  ['', '            b.vx += ax * dt'],
  ['', '            b.vy += ay * dt'],
  ['', '            b.x += b.vx * dt'],
  ['', '            b.y += b.vy * dt'],
  ['cur', '            b.spin *= <n>1</n> - min(<n>0.06</n>, max(<n>0.01</n>, Phys.spinDecayPerSpeed * v)) * dt<caret>'],
  ['', ''],
  ['', '            <k>let</k> ground = hole.ground(at: b.x)'],
  ['', '            <k>if</k> b.y <= ground {'],
  ['', '                <k>let</k> surfType = hole.surface(at: b.x)'],
  ['', '                <k>if</k> surfType == .water { <k>return</k> .water }'],
  ['', '                b.y = ground'],
  ['', '                <k>let</k> s = hole.slope(at: b.x)'],
  ['', '                <k>let</k> baseAng = atan(s)'],
  ['', '                <k>let</k> nx = -sin(ang), ny = cos(ang), tx = cos(ang), ty = sin(ang)'],
  ['', '                <k>let</k> vn = b.vx * nx + b.vy * ny'],
];
function codeHTML(start = 340) {
  return SWIFT.map(([cls, s], i) => {
    const body = s.replace(/<k>/g, '<span class="k">').replace(/<\/k>/g, '</span>')
                  .replace(/<n>/g, '<span class="n">').replace(/<\/n>/g, '</span>')
                  .replace('<caret>', '<span class="caret"></span>');
    const inner = `<span class="ln">${start + i}</span>${cls === 'c' ? `<span class="c">${body}</span>` : body}`;
    return cls === 'cur' ? `<span class="cur">${inner}</span>` : inner + '\n';
  }).join('');
}
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; };
const win = (x, y, w, h, title, body, extra = '') =>
  `<div class="win ${extra}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><div class="bar"><i></i><i></i><i></i><div class="t">${title}</div></div><div class="body">${body}</div></div>`;
const game = (name, style = '') => `<img class="g" src="${CAP}${name}.png" style="${style}">`;
// 한글 HUD 가리기 (영문판): 게임 HUD는 한국어 전용 → 좌하단·중앙 힌트·우하단 글자 영역만 잘라낸다 (지형선은 유지)
const EN_HUD_CLIP = "clip-path:polygon(0 0,100% 0,100% 93.6%,79% 93.6%,79% 100%,63% 100%,63% 93.6%,36% 93.6%,36% 100%,14% 100%,14% 93.6%,0 93.6%)";

function menubar(lang, clock) {
  const items = lang === 'ko' ? ['편집기', '파일', '편집', '보기', '창'] : ['Editor', 'File', 'Edit', 'View', 'Window'];
  return `<div class="menubar"><span class="app">${items[0]}</span>${items.slice(1).map(s => `<span>${s}</span>`).join('')}<span class="sp"></span>${FLAG}<span class="clock">${clock}</span></div>`;
}

const S = {};
/* ═════════ A. 원테이크 — 내 창 위의 한 홀 ═════════ */
function deskA(lang, clock, L) {
  const ko = lang === 'ko';
  const [ex, ey, ew, eh] = L.editor, [dx, dy, dw, dh] = L.doc;
  return menubar(lang, clock)
    + win(dx, dy, dw, dh, ko ? '3분기 계획 — 초안' : 'Q3 plan — draft',
      `<div class="doc"><h3>${ko ? '3분기 로드맵' : 'Q3 roadmap'}</h3><div class="meta">${ko ? '마지막 수정 오후 2:09 · 댓글 4' : 'Edited 2:09 PM · 4 comments'}</div>
       <p>${ko ? '이번 분기는 새 기능보다 이미 있는 흐름을 다듬는 데 쓴다. 가입 첫 5분이 가장 많이 이탈하는 구간이다.' : 'This quarter goes to polishing what we already ship. The first five minutes after sign-up lose the most people.'}</p>
       <ul><li>${ko ? '온보딩 3단계 → 1단계' : 'Onboarding: three steps down to one'}</li><li>${ko ? '결제 오류 메시지 다시 쓰기' : 'Rewrite payment error messages'}</li><li>${ko ? '다크 모드 대비 점검' : 'Dark mode contrast pass'}</li></ul></div>`, 'dim')
    + win(ex, ey, ew, eh, 'Ballistics.swift — mini-golf', `<div class="code" style="margin-top:${L.codeShift || 0}px">${codeHTML()}</div>`);
}
function sceneA(o) {
  const ko = o.lang === 'ko';
  const r = document.getElementById('root');
  const desk = el(`<div id="desk">${deskA(o.lang, ko ? '화 9월 29일 오후 2:14' : 'Tue Sep 29 2:14 PM', o.L)}${game('flight-descent-full', ko ? '' : EN_HUD_CLIP)}</div>`);
  desk.insertAdjacentHTML('beforeend', `<div style="position:absolute;left:${o.cursor[0]}px;top:${o.cursor[1]}px">${CURSOR}</div>`);
  r.appendChild(desk);
  desk.style.transform = `translate(${o.tx}px,${o.ty}px) scale(${o.s})`;
  r.appendChild(el(o.copy));
  window.__ready = true;
}
S['A-h'] = () => sceneA({ lang:'ko', s:1.42, tx:0, ty:-(1080 * 1.42 - 1080), cursor:[610, 640],
  L:{ editor:[40, 372, 948, 680], doc:[1500, 700, 800, 400], codeShift:-120 },
  copy:`<div class="type" style="left:1392px;top:318px;width:470px">
  <div class="kicker">코드를 쓰는 동안,</div>
  <div class="head" style="font-size:64px;margin-top:14px">스틱맨은<br>당신의 창 위를<br>걷습니다.</div></div>` });
S['A-v'] = () => sceneA({ lang:'en', v:1, s:2.0, tx:-80, ty:-520, cursor:[420, 800],
  L:{ editor:[60, 560, 900, 520], doc:[700, 640, 900, 440], codeShift:-200 },
  copy:`<div class="type" style="left:84px;top:300px;width:920px">
  <div class="kicker" style="font-size:36px">While you code,</div>
  <div class="head" style="font-size:80px;margin-top:14px;letter-spacing:-2.2px">a stickman plays<br>through your windows.</div></div>` });

/* ═════════ B. 마침표 — 문장이 그린이 된다 ═════════ */
// 탄도: 항력+양력을 흉내 낸 결정론 궤적 (오르막은 완만, 내리막은 가파르게) — SVG 경로
function trail(x0, y0, x1, y1, apex) {
  // 결정론 탄도 흉내: 수평은 항력으로 감속, 정점은 62% 지점(양력), 하강이 상승보다 가파르다
  const pts = [], N = 120, p = 0.47, ytop = Math.min(y0, y1) - apex;
  for (let i = 0; i <= N; i++) {
    const u = i / N;
    const x = x0 + (x1 - x0) * (1 - Math.pow(1 - u, 1.45));
    const y = u < p ? y0 + (ytop - y0) * (1 - Math.pow(1 - u / p, 2)) : ytop + (y1 - ytop) * Math.pow((u - p) / (1 - p), 2);
    pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
  }
  return pts.join(' ');
}
function sceneB(o) {
  const r = document.getElementById('root'); const ko = o.lang === 'ko';
  const desk = el(`<div id="desk"></div>`);
  desk.insertAdjacentHTML('beforeend', menubar(o.lang, ko ? '화 9월 29일 오전 10:41' : 'Tue Sep 29 10:41 AM'));
  desk.insertAdjacentHTML('beforeend', win(o.win[0], o.win[1], o.win[2], o.win[3], ko ? '메모 — 오늘' : 'Notes — Today', ''));
  desk.insertAdjacentHTML('beforeend', game(o.cap, ko ? '' : EN_HUD_CLIP));
  r.appendChild(desk);
  desk.style.transform = `translate(${o.tx}px,${o.ty}px) scale(${o.s})`;
  if (o.hideBall) desk.insertAdjacentHTML('beforeend', `<div style="position:absolute;left:${o.hideBall[0]}px;top:${o.hideBall[1]}px;width:${o.hideBall[2]}px;height:${o.hideBall[3]}px;background:var(--win)"></div>`);
  // 타이포층 (화면 좌표)
  r.appendChild(el(o.copy));
  // 공 = 마침표, 궤적, 깃발 (화면 좌표로 측정해서 그린다)
  requestAnimationFrame(() => {
    const dot = document.getElementById('period').getBoundingClientRect();
    const cx = dot.left + dot.width / 2, cy = dot.top + dot.height / 2;
    const [sx, sy] = o.from;
    r.querySelector('.type').insertAdjacentHTML('beforebegin', `<svg style="position:absolute;left:0;top:0" width="${r.offsetWidth}" height="${r.offsetHeight}">
      <polyline points="${trail(sx, sy, cx, cy, o.apex)}" fill="none" stroke="#9A9B97" stroke-width="${o.v ? 2 : 1.6}" opacity=".7"/></svg>`);
    document.getElementById('period').style.visibility = 'visible';
    window.__ready = true;
  });
}
const PERIOD = (size) => `<span id="period" style="display:inline-block;width:${size}px;height:${size}px;border-radius:50%;background:#FAFAF8;margin-left:${size * .28}px;vertical-align:baseline;visibility:hidden"></span>`;
const FLAGPIN = (h) => `<svg style="display:inline-block;vertical-align:baseline;margin-left:6px" width="${h * .5}" height="${h}" viewBox="0 0 30 60"><line x1="4" y1="2" x2="4" y2="60" stroke="#F4F4F1" stroke-width="2.4"/><path d="M5.2 3 L28 10.5 L5.2 18 Z" fill="#D94D3D"/></svg>`;
S['B-h'] = () => sceneB({ lang:'ko', s:1.0, tx:0, ty:0, win:[70, 60, 1780, 990], cap:'motion-twirl', hideBall:[684.5, 880.5, 11, 9], from:[190, 846], apex:300,
  copy:`<div class="type" style="left:196px;top:250px;width:1500px">
    <div class="head" style="font-size:64px;color:#5E5F5C;font-weight:600;letter-spacing:-1.2px">메일 답장을 기다리는 동안,</div>
    <div class="head" style="font-size:128px;margin-top:18px;letter-spacing:-4.5px;white-space:nowrap">9홀이 조용히 돌아갑니다${PERIOD(30)}<span class="caret" style="height:112px;width:4px;vertical-align:-14px;margin-left:10px"></span></div></div>` });
S['B-v'] = () => sceneB({ lang:'en', v:1, s:2.0, tx:-40, ty:-480, win:[24, 40, 1860, 1030], cap:'motion-twirl', hideBall:[684.5, 880.5, 11, 9], from:[316, 1212], apex:260,
  copy:`<div class="type" style="left:90px;top:420px;width:920px">
    <div class="head" style="font-size:52px;color:#5E5F5C;font-weight:600;letter-spacing:-1px;line-height:1.2">While you wait<br>on a reply,</div>
    <div class="head" style="font-size:118px;margin-top:30px;letter-spacing:-4.2px;line-height:1.04">nine holes<br>play quietly${PERIOD(27)}<span class="caret" style="height:100px;width:4px;vertical-align:-10px;margin-left:8px"></span></div></div>` });

/* ═════════ C. 9시 1번 홀, 6시 9번 홀 — 하루 한 라운드 ═════════ */
function deskC(lang, when) {
  const ko = lang === 'ko';
  if (when === 'noon') {
    return win(1040, 470, 820, 570, ko ? '점심 투표' : 'Lunch poll',
      `<div class="doc"><h3>${ko ? '오늘 점심 — 11:55 마감' : 'Lunch today — closes 11:55'}</h3><div class="meta">${ko ? '7명 투표' : '7 votes'}</div>
      <ul><li>${ko ? '국밥 · 3' : 'Noodle bar · 3'}</li><li>${ko ? '샐러드 · 2' : 'Salad place · 2'}</li><li>${ko ? '김밥 포장 · 2' : 'Sandwiches to go · 2'}</li></ul></div>`, 'dim')
      + win(90, 520, 1060, 520, 'Course.swift — mini-golf', `<div class="code" style="margin-top:-60px;opacity:.7">${codeHTML(120)}</div>`, 'dim');
  }
  return win(40, 700, 820, 420, ko ? '주간 보고 — 금요일' : 'Weekly update — Friday',
    `<div class="doc" style="padding-top:236px"><h3>${ko ? '이번 주 한 일' : 'This week'}</h3><div class="meta">${ko ? '오후 5:51 저장됨' : 'Saved 5:51 PM'}</div>
     <ul><li>${ko ? '탄도 스텝 리뷰 반영' : 'Ballistics review addressed'}</li><li>${ko ? '온보딩 문구 교체' : 'Onboarding copy replaced'}</li></ul></div>`, 'dim');
}
function sceneC(o) {
  const r = document.getElementById('root'); const ko = o.lang === 'ko';
  const desk = el(`<div id="desk" style="${o.wall ? 'background:' + o.wall : ''}"></div>`);
  desk.insertAdjacentHTML('beforeend', menubar(o.lang, o.clockSmall) + deskC(o.lang, o.when) + o.deskScrim + game(o.cap, ko ? '' : EN_HUD_CLIP));
  r.appendChild(desk);
  desk.style.transform = `translate(${o.tx}px,${o.ty}px) scale(${o.s})`;
  r.appendChild(el(o.copy));
  // 9홀 진행 표시 (홀 = 점, 친 홀은 채움)
  window.__ready = true;
}
const HOLES = (done, size, gap, cur) => `<div style="display:flex;gap:${gap}px;align-items:center">${Array.from({ length: 9 }, (_, i) =>
  `<span style="width:${size}px;height:${size}px;border-radius:50%;${i < done ? 'background:#F4F4F1' : 'border:2px solid #4A4B48'};${i === cur ? 'background:#D94D3D;border:none' : ''}"></span>`).join('')}</div>`;
S['C-h'] = () => sceneC({ lang:'ko', when:'noon', s:1.0, tx:0, ty:0, deskScrim:'', cap:'geese-line-full', clockSmall:'화 9월 29일 오전 11:52',
  copy:`<div class="type" style="left:96px;top:70px">
    <div style="font-size:232px;font-weight:300;letter-spacing:-10px;line-height:1;font-variant-numeric:tabular-nums">11:52</div>
    <div style="display:flex;align-items:center;gap:26px;margin-top:22px">${HOLES(2, 16, 12, 2)}<span class="sub" style="font-size:28px;color:#C9CAC6;font-weight:600">3번 홀 · 협곡</span><span class="sub" style="font-size:28px">— 거위가 먼저 와 있었다.</span></div></div>` });
S['C-v'] = () => sceneC({ lang:'en', when:'eve', v:1, s:2.0, tx:-120, ty:-560, deskScrim:'', cap:'putt-stroke-full', clockSmall:'Tue Sep 29 5:58 PM',
  wall:'radial-gradient(120% 90% at 70% 10%, #1E1813 0%, #120F0D 55%, #0B0A09 100%)',
  copy:`<div class="type" style="left:84px;top:300px">
    <div style="font-size:212px;font-weight:300;letter-spacing:-9px;line-height:1;font-variant-numeric:tabular-nums">5:58<span style="font-size:74px;letter-spacing:-1px;margin-left:14px;font-weight:500;color:#8E8F8B">pm</span></div>
    <div style="margin-top:34px">${HOLES(8, 20, 14, 8)}</div>
    <div class="head" style="font-size:60px;margin-top:34px;letter-spacing:-1.6px">Hole 9, the forest.<br><span style="color:#8E8F8B;font-weight:600">One round, one workday.</span></div></div>` });

const key = (location.hash || '#A-h').slice(1);
document.getElementById('root').className = key.endsWith('-v') ? 'v' : 'h';
document.fonts.ready.then(() => S[key]());
</script>
