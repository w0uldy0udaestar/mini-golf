<script>
'use strict';

/* 포인트 컬러는 깃발 하나에만 — 스틱맨을 포함한 게임 요소는 회색 베이스 */
const ACCENT = '#d64533';
const STICK = 'rgba(224, 226, 228, 0.95)';

/* ══════════════ 클럽 데이터 (GolfCore.ClubTable로 이식 예정) ══════════════
   loft/spin/power는 내부 물리용 — UI에는 숫자를 노출하지 않는다 (조준 어시스트 배제).
   cat: 스틱맨이 든 클럽의 헤드 디자인 구분                                  */
const CLUBS = [
  { id: 'DR', name: '드라이버',   cat: 'wood',   loft: 10.5, spin: 2700,  power: 75 },
  { id: '3W', name: '3번 우드',   cat: 'wood',   loft: 15,   spin: 3600,  power: 70 },
  { id: '5W', name: '5번 우드',   cat: 'wood',   loft: 18,   spin: 4300,  power: 66 },
  { id: '3I', name: '3번 아이언', cat: 'iron',   loft: 21,   spin: 4600,  power: 62 },
  { id: '4I', name: '4번 아이언', cat: 'iron',   loft: 24,   spin: 5000,  power: 59 },
  { id: '5I', name: '5번 아이언', cat: 'iron',   loft: 27,   spin: 5400,  power: 56 },
  { id: '6I', name: '6번 아이언', cat: 'iron',   loft: 30,   spin: 6100,  power: 53 },
  { id: '7I', name: '7번 아이언', cat: 'iron',   loft: 34,   spin: 7000,  power: 50 },
  { id: '8I', name: '8번 아이언', cat: 'iron',   loft: 38,   spin: 7900,  power: 47 },
  { id: '9I', name: '9번 아이언', cat: 'iron',   loft: 42,   spin: 8500,  power: 44 },
  { id: 'PW', name: '피칭 웨지',  cat: 'wedge',  loft: 46,   spin: 9300,  power: 41 },
  { id: 'SW', name: '샌드 웨지',  cat: 'wedge',  loft: 56,   spin: 10500, power: 35 },
  { id: 'PT', name: '퍼터',       cat: 'putter', loft: 0,    spin: 0,     power: 13, putter: true },
];
const CAT_LABEL = { wood: '우드', iron: '아이언', wedge: '웨지', putter: '퍼터' };

/* ══════════════ 지면(라이) 종류 — 실제 골프처럼 물리 차등 ══════════════
   roll: 굴림 감속(m/s²), rest: 바운스 반발, power/spin: 이 라이에서 칠 때 배율 */
const SURFACES = {
  tee:      { label: '티',       roll: 2.0, rest: 0.42, power: 1.0,  spin: 1.0 },
  fairway:  { label: '페어웨이', roll: 2.2, rest: 0.42, power: 1.0,  spin: 1.0 },
  rough:    { label: '러프',     roll: 4.5, rest: 0.25, power: 0.75, spin: 0.5 },
  apron:    { label: '에이프런', roll: 1.6, rest: 0.38, power: 1.0,  spin: 0.9 },
  green:    { label: '그린',     roll: 1.1, rest: 0.35, power: 1.0,  spin: 0.9 },
  bunker:   { label: '벙커',     roll: 8.0, rest: 0.05, power: 0.45, spin: 0.25 }, // 공이 박힘, 탈출샷만
  water:    { label: '워터',     roll: 99,  rest: 0,    power: 1.0,  spin: 1.0 },  // 입수 = 1벌타 + 드롭
};

/* ══════════════ 물리 상수 (GolfCore.BallisticsEngine으로 이식 예정) ══════ */
const PHYS = {
  g: 9.81,
  q: 0.01869,            // 0.5·ρ·A/m  (ρ=1.2, A=0.00143㎡, m=0.0459kg)
  cd: 0.25,              // 항력 계수
  ballRadius: 0.0213,    // m
  clBase: 0.04, clSlope: 1.8, clMax: 0.35, spinRatioMax: 0.30, // 양력 계수 모델
  spinDecayFlight: 0.04, // 비행 중 스핀 감쇠 (비율/초)
  bounceVxKeep: 0.72,    // 바운스 시 전진 속도 보존율
  bounceSpinKick: 9.0,   // 백스핀 체크 최대 역방향 킥 (m/s @ 12000rpm)
  bounceSpinKeep: 0.55,  // 바운스 후 스핀 보존율
  bounceToRoll: 1.0,     // 이 반발 속도(m/s) 이하이면 롤 전환
  stopSpeed: 0.15,
  minPowerRatio: 0.25,   // 백스윙 0%에서의 파워 바닥값
  cupHalfWidth: 0.7,     // 컵 캡처 반경 (m, 플레이 편의로 실제보다 큼)
  captureRoll: 3.0,      // 롤 상태 캡처 최대 속도
  lipOutSpeed: 5.5,      // 이 속도까지는 립아웃(턱 맞고 근처 정지), 초과 시 그냥 통과
  captureFly: 10.0,      // 직접 낙하 캡처 최대 속도
  putterMinRatio: 0.08,  // 퍼터 전용 파워 바닥값 (탭인 가능)
  wallRestitution: 0.5,
  maxStrokes: 12,
  timeScale: 2.5,        // 재생 배속
};

const TEE_X = 25; // 백스윙·피니시 포즈가 화면 왼쪽에서 잘리지 않도록 여유 확보
const DT = 1 / 240; // 고정 물리 스텝

/* ══════════════ 시드 랜덤 ══════════════ */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ══════════════ 코스 생성 — 화이트 티 실거리 기준 ══════════════
   파3 110~170m · 파4 250~360m · 파5 430~500m, 9홀 파 36 구성 */
const PAR_COMPOSITION = [3, 3, 4, 4, 4, 4, 4, 5, 5];
const DIST_RANGE = { 3: [110, 170], 4: [250, 360], 5: [430, 500] };

/* 세그먼트 배열에서 [from, to) 구간을 지정 타입으로 대체 (겹치는 밴드는 쪼갬) */
function carveSegment(segments, from, to, type) {
  const out = [];
  for (const s of segments) {
    if (s.to <= from || s.from >= to) { out.push(s); continue; }
    if (s.from < from) out.push({ from: s.from, to: from, type: s.type });
    if (s.to > to) out.push({ from: to, to: s.to, type: s.type });
  }
  out.push({ from, to, type });
  out.sort((a, b) => a.from - b.from);
  return out;
}

function makeCourse(seed) {
  const rand = mulberry32(seed);
  const pars = [...PAR_COMPOSITION];
  for (let i = pars.length - 1; i > 0; i--) { // 셔플
    const j = Math.floor(rand() * (i + 1));
    [pars[i], pars[j]] = [pars[j], pars[i]];
  }
  return pars.map((par) => {
    const [lo, hi] = DIST_RANGE[par];
    const dist = lo + rand() * (hi - lo);
    const holeX = TEE_X + dist;
    const worldW = holeX + 45;

    // 그린·에이프런 (홀 주변)
    const greenStart = holeX - (10 + rand() * 5);
    const greenEnd = holeX + (7 + rand() * 4);
    const apronStart = greenStart - (4 + rand() * 3);

    // 티~에이프런 사이를 페어웨이/러프 랜덤 밴드로 채움
    const teeEnd = TEE_X + 10;
    let segments = [{ from: 0, to: teeEnd, type: 'tee' }];
    let x = teeEnd;
    let cur = rand() < 0.75 ? 'fairway' : 'rough';
    while (x < apronStart) {
      const w = 30 + rand() * 55;
      segments.push({ from: x, to: Math.min(x + w, apronStart), type: cur });
      x += w;
      cur = cur === 'fairway' ? 'rough' : 'fairway';
    }
    segments.push({ from: apronStart, to: greenStart, type: 'apron' });
    segments.push({ from: greenStart, to: greenEnd, type: 'green' });
    segments.push({ from: greenEnd, to: worldW, type: 'rough' });

    /* ── 지형 고저: 30~50m 간격 제어점에 완만한 언덕·계곡, 티는 평지 ── */
    const nodes = [{ x: 0, e: 0 }, { x: teeEnd + 8, e: 0 }];
    let nx = teeEnd + 8, ne = 0;
    while (nx < worldW) {
      nx += 30 + rand() * 20;
      ne = Math.max(-5, Math.min(7, ne + (rand() * 2 - 1) * 3.5));
      nodes.push({ x: Math.min(nx, worldW), e: ne });
    }
    // 1m 간격 샘플로 굽기 (코사인 보간)
    const elev = new Float32Array(Math.ceil(worldW) + 2);
    let ni = 0;
    for (let i = 0; i < elev.length; i++) {
      while (ni < nodes.length - 2 && i > nodes[ni + 1].x) ni++;
      const a = nodes[ni], b = nodes[Math.min(ni + 1, nodes.length - 1)];
      const u = b.x === a.x ? 0 : Math.min(1, Math.max(0, (i - a.x) / (b.x - a.x)));
      elev[i] = a.e + (b.e - a.e) * (0.5 - 0.5 * Math.cos(u * Math.PI));
    }

    /* ── 워터 해저드: 파4·5의 중반부에 35% 확률, 평평한 저지대 ── */
    let waterRange = null;
    if (par >= 4 && rand() < 0.35) {
      const wFrom = teeEnd + 40 + rand() * (apronStart - teeEnd - 100);
      const wTo = wFrom + 15 + rand() * 15;
      if (wTo < apronStart - 25) {
        waterRange = { from: wFrom, to: wTo };
        segments = carveSegment(segments, wFrom, wTo, 'water');
        const wl = Math.min(elev[Math.floor(wFrom)], elev[Math.ceil(wTo)]) - 1.2;
        for (let i = Math.floor(wFrom); i <= Math.ceil(wTo) && i < elev.length; i++) elev[i] = wl;
        for (let k = 1; k <= 4; k++) { // 물가 경사 자연스럽게
          const uu = k / 5;
          const li = Math.floor(wFrom) - k, ri = Math.ceil(wTo) + k;
          if (li >= 0) elev[li] = wl * (1 - uu) + elev[li] * uu;
          if (ri < elev.length) elev[ri] = wl * (1 - uu) + elev[ri] * uu;
        }
      }
    }

    /* ── 벙커: 그린 앞 1개(60%) + 페어웨이 중반 1개(35%), 얕은 모래 구덩이 ── */
    const addBunker = (bFrom, width) => {
      const bTo = bFrom + width;
      if (waterRange && bFrom < waterRange.to + 6 && bTo > waterRange.from - 6) return;
      if (bTo >= greenStart - 1 || bFrom <= teeEnd + 5) return;
      segments = carveSegment(segments, bFrom, bTo, 'bunker');
      const mid = (bFrom + bTo) / 2;
      for (let i = Math.floor(bFrom); i <= Math.ceil(bTo) && i < elev.length; i++) {
        const d = 1 - Math.abs(i - mid) / (width / 2 + 0.5); // 가운데가 깊게
        elev[i] -= Math.max(0, d) * 0.9;
      }
    };
    if (rand() < 0.6) addBunker(greenStart - 4 - (3 + rand() * 5), 5 + rand() * 3);
    if (rand() < 0.35) addBunker(teeEnd + 50 + rand() * (apronStart - teeEnd - 90), 6 + rand() * 4);

    /* ── 그린: 주변 지형 흐름을 따르는 미세 경사(브레이크) ── */
    const gFrom = Math.floor(apronStart - 2), gTo = Math.min(Math.ceil(greenEnd + 6), elev.length - 1);
    const trend = elev[gTo] >= elev[gFrom] ? 1 : -1;
    const gSlope = trend * (0.02 + rand() * 0.04); // 2~6% 브레이크
    const gBase = elev[gFrom];
    for (let i = gFrom; i <= gTo; i++) elev[i] = gBase + gSlope * (i - gFrom);
    for (let k = 1; k <= 5; k++) { // 그린 뒤 러프와 자연 연결
      const ri = gTo + k;
      if (ri < elev.length) elev[ri] = (elev[gTo] * (5 - k)) / 5 + (elev[ri] * k) / 5;
    }

    return { par, dist, holeX, worldW, segments, greenStart, greenEnd, apronStart, elev, waterRange, gSlope };
  });
}

function surfaceAt(h, x) {
  for (const s of h.segments) if (x >= s.from && x < s.to) return s.type;
  return 'rough';
}

/* 지형 표고·경사 조회 */
function gAt(h, x) {
  const xi = Math.max(0, Math.min(h.elev.length - 2, x));
  const i = Math.floor(xi);
  return h.elev[i] + (h.elev[i + 1] - h.elev[i]) * (xi - i);
}
function slopeAt(h, x) {
  return gAt(h, x + 0.5) - gAt(h, x - 0.5);
}

function scoreName(strokes, par) {
  if (strokes === 1) return '홀인원!';
  const d = strokes - par;
  if (d <= -3) return '알바트로스';
  if (d === -2) return '이글';
  if (d === -1) return '버디';
  if (d === 0) return '파';
  if (d === 1) return '보기';
  if (d === 2) return '더블 보기';
  return `+${d}`;
}

/* ══════════════ 게임 상태 ══════════════ */
const game = {
  mode: 'aim',            // aim | swinging | motion | holed | end
  course: [], holeIdx: 0, results: [],
  strokes: 0, clubIdx: 0, heightPct: 0.6,
  ball: { x: TEE_X, y: 0, vx: 0, vy: 0, spin: 0, spinSign: 1, phase: 'rest' },
  trail: [], holedAnim: 0,
  stickX: TEE_X, stickDir: 1, // 스틱맨 위치·타격 방향
  swingAnim: null,            // { t, launched, prof, fromPose } — 다운스윙~피니시
  walkAnim: null,             // { from, to, t, dur, relax, phase, vPx } — 피니시 풀기 → 걷기
  lastFinishPose: null,       // 볼 비행 중 유지할 피니시 포즈
  renderPose: null,           // 화면에 실제 그리는 포즈 — 목표 포즈를 지수 감쇠로 추적 (모든 전환이 부드러워짐)
  renderBf: 24,               // 스탠스 내 공 위치도 같은 방식으로 스무딩
};

/* 스윙 타이밍(초): 다운스윙이 가장 빠른 비대칭 리듬이 스윙 느낌의 핵심 (P-System 리서치) */
const SWING = { follow: 0.14, finish: 0.22, total: 0.5 };

/* P-System 키프레임 (골프 교습 표준 P1~P10 중 6개 — docs/research-swing-pose.md)
   hipDx: 힙 수평 이동(체중 이동, +=타겟 쪽) · tilt: 척추 측면 기울기(+=타겟 쪽)
   handA: 어깨→손 방향각(0=수직 아래, +=타겟 쪽) · handD: 어깨→손 거리(팔 접힘)
   clubA: 샤프트 절대각(0=수직 아래, +=타겟 쪽) · heel: 뒷발꿈치 들림(px) · headDx: 머리 오프셋 */
const POSES = {
  P1:  { hipDx: 0,  tilt: -5,  handA: 12,   handD: 34, clubA: 12,   heel: 0,  headDx: 7 },  // 어드레스
  P2:  { hipDx: -2, tilt: -9,  handA: -40,  handD: 34, clubA: -85,  heel: 0,  headDx: 7 },  // 테이크어웨이
  P4:  { hipDx: -6, tilt: -18, handA: -145, handD: 28, clubA: -175, heel: 0,  headDx: 6 },  // 톱
  P7:  { hipDx: 6,  tilt: -12, handA: 14,   handD: 34, clubA: 6,    heel: 5,  headDx: 7 },  // 임팩트
  P8:  { hipDx: 9,  tilt: 18,  handA: 85,   handD: 34, clubA: 100,  heel: 9,  headDx: 9 },  // 팔로스루: 타겟 방향 풀 익스텐션
  P10: { hipDx: 16, tilt: 6,   handA: 148,  handD: 22, clubA: 300,  heel: 14, headDx: 4 },  // 피니시: 힙이 앞발 위(수직 축), 몸 거의 직립, 손은 귀 옆, 클럽은 등 뒤 대각선
};
/* 퍼터 전용: 몸을 쓰지 않는 펜듈럼 스트로크 (어깨 진자, 체중 이동·피니시 없음) */
const PT_POSES = {
  A:   { hipDx: 0, tilt: -3, handA: 10,  handD: 30, clubA: 8,   heel: 0, headDx: 7 },
  TOP: { hipDx: 0, tilt: -4, handA: -22, handD: 30, clubA: -30, heel: 0, headDx: 7 },
  IMP: { hipDx: 1, tilt: -3, handA: 12,  handD: 30, clubA: 10,  heel: 0, headDx: 7 },
  FIN: { hipDx: 2, tilt: -2, handA: 30,  handD: 30, clubA: 38,  heel: 0, headDx: 8 },
};
/* 클럽을 옆에 들고 선 직립 자세 — 걷기와 어드레스 사이의 전환 기준 포즈 */
const UPRIGHT = { hipDx: 0, tilt: 2, handA: -18, handD: 30, clubA: -35, heel: 0, headDx: 5 };
const WALK_STRIDE = 16; // 걷기 보폭 반경(px) — 걸음 주기 ω = 속도/보폭으로 발 미끄럼 방지

/* 클럽별 스윙 프로파일: 실제 골프처럼 클럽마다 스윙 폭·볼 위치·피니시가 다르다
   topScale: 백스윙 최대 폭 · ballFwd: 스탠스에서 공 위치(px, 드라이버=앞발 쪽)
   finishScale: 피니시 감김 정도 · down: 다운스윙 시간(퍼터는 진자라 더 느림) */
const SWING_PROFILE = {
  wood:   { topScale: 1.0,  ballFwd: 24, finishScale: 1.0,  down: 0.13 },
  iron:   { topScale: 0.88, ballFwd: 20, finishScale: 0.9,  down: 0.13 },
  wedge:  { topScale: 0.72, ballFwd: 17, finishScale: 0.72, down: 0.13 },
  putter: { topScale: 1.0,  ballFwd: 18, finishScale: 1.0,  down: 0.2, putter: true },
};
const clubProfile = () => SWING_PROFILE[CLUBS[game.clubIdx].cat];

const lerpPose = (a, b, u) => { const o = {}; for (const k in a) o[k] = a[k] + (b[k] - a[k]) * u; return o; };
const smoothstep = (u) => u * u * (3 - 2 * u);

/* 백스윙 궤적: ↑↓ 입력이 어드레스→테이크어웨이→톱 경로 위의 몸 전체 포즈를 움직인다 */
function backswingPose(h) {
  const prof = clubProfile();
  if (prof.putter) return lerpPose(PT_POSES.A, PT_POSES.TOP, h);
  const s = 0.22 + 0.78 * h * prof.topScale;
  return s < 0.35 ? lerpPose(POSES.P1, POSES.P2, s / 0.35)
                  : lerpPose(POSES.P2, POSES.P4, (s - 0.35) / 0.65);
}

function finishPose(prof) {
  if (prof.putter) return PT_POSES.FIN;
  return lerpPose(POSES.P8, POSES.P10, prof.finishScale);
}

function currentPose() {
  if (game.swingAnim) {
    const a = game.swingAnim;
    const prof = a.prof;
    if (a.t < prof.down) { // 다운스윙: 급가속 (퍼터는 진자라 완만)
      const u = a.t / prof.down;
      const impact = prof.putter ? PT_POSES.IMP : POSES.P7;
      return lerpPose(a.fromPose, impact, prof.putter ? smoothstep(u) : u * u);
    }
    const t2 = a.t - prof.down;
    if (prof.putter) { // 퍼터: 임팩트 → 짧은 팔로만
      const v = Math.min(1, t2 / 0.25);
      return lerpPose(PT_POSES.IMP, PT_POSES.FIN, 1 - (1 - v) * (1 - v));
    }
    if (t2 < SWING.follow) return lerpPose(POSES.P7, POSES.P8, t2 / SWING.follow);
    const v = Math.min(1, (t2 - SWING.follow) / SWING.finish);
    return lerpPose(POSES.P8, finishPose(prof), 1 - (1 - v) * (1 - v)); // 감속하며 피니시
  }
  if (game.mode === 'aim') return backswingPose(game.heightPct);
  if (game.mode === 'walking') return UPRIGHT; // 걷기 전(relax)·중엔 직립이 목표
  return game.lastFinishPose || POSES.P10; // 볼 비행 중엔 피니시 자세 유지
}

function newRound(seed) {
  game.course = makeCourse(seed ?? (Date.now() & 0x7fffffff));
  game.holeIdx = 0; game.results = [];
  startHole();
  hideScorecard();
}

function startHole() {
  game.strokes = 0;
  game.ball = { x: TEE_X, y: 0, vx: 0, vy: 0, spin: 0, spinSign: 1, phase: 'rest' };
  game.trail = [];
  game.swingAnim = null;
  enterAim();
}

function enterAim() {
  game.mode = 'aim';
  game.walkAnim = null;
  game.stickX = game.ball.x;
  game.stickDir = hole().holeX >= game.ball.x ? 1 : -1;
  updateHud();
}

/* 샷 후 실제 골퍼처럼 여유롭게 걸어간다: 피니시 풀기(relax) → 걷기 → 어드레스 */
function startWalk() {
  const from = game.stickX, to = game.ball.x;
  const dist = Math.abs(to - from);
  if (dist < 1) { enterAim(); return; }
  game.mode = 'walking';
  game.stickDir = to >= from ? 1 : -1;
  // phase -0.6: 걷기 시작 시 발이 어드레스 스탠스와 비슷하게 벌어진 상태에서 출발
  game.walkAnim = { from, to, t: 0, dur: Math.min(4.5, Math.max(1.0, dist / 55)), relax: 0.4, phase: -0.6, vPx: 0 };
  updateHud();
}

function hole() { return game.course[game.holeIdx]; }

/* ══════════════ 샷 ══════════════ */
function startSwing() {
  game.mode = 'swinging';           // 입력 잠금, 다운스윙 시작
  // fromPose = 화면에 보이는 바로 그 포즈 — 다운스윙이 끊김 없이 시작된다
  game.swingAnim = { t: 0, launched: false, prof: clubProfile(), fromPose: { ...(game.renderPose || backswingPose(game.heightPct)) } };
}

function launchBall() {
  const club = CLUBS[game.clubIdx];
  const b = game.ball;
  const dir = game.stickDir;
  // 라이 페널티: 첫 타는 티샷(클린), 이후는 공이 놓인 지면 기준
  const lie = game.strokes === 0 ? SURFACES.tee : SURFACES[surfaceAt(hole(), b.x)];
  // 퍼터: 선형 파워(예측 가능) + 낮은 바닥값(탭인 가능). 제곱 곡선은 중간 파워를
  // 뭉개서 퍼팅이 약해지는 문제로 폐기 (2026-08-13) — 정밀함은 조절 속도 절반으로 확보
  const minR = club.putter ? PHYS.putterMinRatio : PHYS.minPowerRatio;
  const v0 = club.power * lie.power * (minR + (1 - minR) * game.heightPct);
  b.lipped = false;
  const loftRad = (club.loft * Math.PI) / 180;
  b.vx = dir * v0 * Math.cos(loftRad);
  b.vy = v0 * Math.sin(loftRad);
  b.spin = club.spin * lie.spin * (0.6 + 0.4 * game.heightPct);
  b.spinSign = dir;
  b.phase = club.putter ? 'roll' : 'fly';
  game.strokes++;
  game.trail = [];
  game.mode = 'motion';
  updateHud();
}

/* ══════════════ 물리 (결정론적 스텝 — 단위 테스트 대상) ══════════════
   지형 표고 gAt(x)·경사 slopeAt(x) 기반: 경사면 바운스는 법선 반사,
   굴림은 중력의 경사 성분이 더해져 오르막은 서고 내리막은 흘러내린다 */
function physicsStep(b, dt) {
  const h = hole();
  if (b.phase === 'fly') {
    const v = Math.hypot(b.vx, b.vy) || 1e-9;
    const omega = (b.spin * 2 * Math.PI) / 60;          // rad/s
    const spinRatio = Math.min((PHYS.ballRadius * omega) / v, PHYS.spinRatioMax);
    const cl = Math.min(PHYS.clMax, PHYS.clBase + PHYS.clSlope * spinRatio);
    // 항력(속도 반대) + 마그누스 양력(속도 수직, 백스핀=위) + 중력
    const ax = -PHYS.q * PHYS.cd * v * b.vx + PHYS.q * cl * v * -b.vy * b.spinSign;
    const ay = -PHYS.g - PHYS.q * PHYS.cd * v * b.vy + PHYS.q * cl * v * b.vx * b.spinSign;
    b.vx += ax * dt; b.vy += ay * dt;
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.spin *= 1 - PHYS.spinDecayFlight * dt;

    const ground = gAt(h, b.x);
    if (b.y <= ground) {
      const surfType = surfaceAt(h, b.x);
      if (surfType === 'water') return 'water';
      const surf = SURFACES[surfType];
      b.y = ground;
      // 경사면 법선/접선 분해 반사
      const s = slopeAt(h, b.x);
      const L = Math.hypot(1, s);
      const nx = -s / L, ny = 1 / L, tx = 1 / L, ty = s / L;
      const vn = b.vx * nx + b.vy * ny;
      if (vn < 0) {
        let vt = b.vx * tx + b.vy * ty;
        const kick = (Math.min(b.spin, 12000) / 12000) * PHYS.bounceSpinKick * b.spinSign;
        vt = vt * PHYS.bounceVxKeep - kick;
        const vnNew = -vn * surf.rest;
        b.spin *= PHYS.bounceSpinKeep;
        if (vnNew > PHYS.bounceToRoll) {
          b.vx = vt * tx + vnNew * nx;
          b.vy = vt * ty + vnNew * ny;
        } else {
          b.phase = 'roll';
          b.vx = vt * tx; // 접선 속도의 수평 성분으로 롤 전환
          b.vy = 0;
        }
      }
    }
  } else if (b.phase === 'roll') {
    b.x += b.vx * dt;
    const surfType = surfaceAt(h, b.x);
    if (surfType === 'water') return 'water';
    const surf = SURFACES[surfType];
    const s = slopeAt(h, b.x);
    b.vx -= PHYS.g * s * 0.85 * dt;                    // 경사 중력: 그린 브레이크의 원천
    const dv = surf.roll * dt;
    if (Math.abs(b.vx) <= dv) b.vx = 0; else b.vx -= Math.sign(b.vx) * dv;
    b.y = gAt(h, b.x);
    // 정지: 마찰이 경사 중력을 이길 때만 (가파른 내리막에선 계속 흘러내림)
    if (Math.abs(b.vx) < PHYS.stopSpeed && surf.roll >= PHYS.g * Math.abs(s) * 0.85) {
      b.vx = 0; b.phase = 'rest';
      // 립아웃 직후 컵 위에서 멈추면 컵 가장자리에 걸친 것으로 처리
      if (b.lipped && Math.abs(b.x - h.holeX) < PHYS.cupHalfWidth) {
        b.x = h.holeX + (b.x >= h.holeX ? 1 : -1) * (PHYS.cupHalfWidth + 0.05);
        b.y = gAt(h, b.x);
      }
    }
  }

  // 좌우 벽 반사
  if (b.x < 0.5) { b.x = 0.5; b.vx = -b.vx * PHYS.wallRestitution; }
  if (b.x > h.worldW - 0.5) { b.x = h.worldW - 0.5; b.vx = -b.vx * PHYS.wallRestitution; }

  // 컵 캡처 / 립아웃 — 임계값 절벽을 연속 구간으로:
  // 롤 ≤3.0 m/s 홀인 · 3.0~5.5 립아웃(턱에 맞고 튀어 과속 비례로 근처 정지) · >5.5 통과
  if (b.lipped) {
    if (Math.abs(b.x - h.holeX) > PHYS.cupHalfWidth + 0.2) b.lipped = false;
  } else if (Math.abs(b.x - h.holeX) < PHYS.cupHalfWidth) {
    const speed = Math.hypot(b.vx, b.vy);
    if (b.phase === 'roll') {
      if (Math.abs(b.vx) <= PHYS.captureRoll) return 'holed';
      if (Math.abs(b.vx) <= PHYS.lipOutSpeed) {
        b.lipped = true;
        const over = (Math.abs(b.vx) - PHYS.captureRoll) / (PHYS.lipOutSpeed - PHYS.captureRoll);
        b.phase = 'fly';
        b.vy = 0.8 + over * 0.7;                       // 톡 튀어오르는 연출
        b.vx = Math.sign(b.vx) * (0.5 + over * 1.2);   // 컵 너머 0.3~1.5m에 멈추는 수준
        b.spin = 0;
      }
    } else if (b.phase === 'fly' && b.y < gAt(h, b.x) + 0.3 && b.vy < 0 && speed <= PHYS.captureFly) {
      return 'holed';
    }
  }
  return b.phase;
}

function onHoled() {
  game.mode = 'holed';
  game.holedAnim = 0;
  const h = hole();
  game.results.push({ par: h.par, strokes: game.strokes });
  const name = scoreName(game.strokes, h.par);
  showToast(name, `${game.strokes}타 · 파 ${h.par} · ${Math.round(h.dist)}m`);
  setTimeout(() => {
    hideToast();
    if (game.holeIdx < 8) { game.holeIdx++; startHole(); }
    else { game.mode = 'end'; showScorecard(); }
  }, 1700);
}

/* 워터 해저드: 1벌타 + 입수 지점 앞 드롭 */
function onWater() {
  game.strokes++; // 벌타
  const h = hole();
  const wr = h.waterRange || { from: game.ball.x - 3, to: game.ball.x + 3 };
  const dropX = game.stickDir > 0 ? wr.from - 2.5 : wr.to + 2.5;
  game.ball = { x: dropX, y: gAt(h, dropX), vx: 0, vy: 0, spin: 0, spinSign: 1, phase: 'rest', lipped: false };
  showToast('워터 해저드 💧', '+1 벌타 · 드롭');
  setTimeout(hideToast, 1500);
  if (game.strokes >= PHYS.maxStrokes) { onGiveUp(); return; }
  startWalk();
}

function onGiveUp() {
  const h = hole();
  game.results.push({ par: h.par, strokes: PHYS.maxStrokes, gaveUp: true });
  showToast('기권', `${PHYS.maxStrokes}타 초과`);
  setTimeout(() => {
    hideToast();
    if (game.holeIdx < 8) { game.holeIdx++; startHole(); }
    else { game.mode = 'end'; showScorecard(); }
  }, 1400);
}

/* ══════════════ 입력 ══════════════ */
const held = new Set();
window.addEventListener('keydown', (e) => {
  const k = e.code;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(k)) e.preventDefault();

  if (k === 'KeyR') { newRound(); return; }
  if (game.mode !== 'aim') return;

  if (k === 'ArrowUp' || k === 'ArrowDown') held.add(k);
  if (k === 'ArrowLeft')  { game.clubIdx = Math.max(0, game.clubIdx - 1); updateHud(); }
  if (k === 'ArrowRight') { game.clubIdx = Math.min(CLUBS.length - 1, game.clubIdx + 1); updateHud(); }
  if (k === 'Space') startSwing();
});
window.addEventListener('keyup', (e) => held.delete(e.code));
window.addEventListener('blur', () => held.clear()); // 포커스 잃으면 입력 해제 (실제 앱: 자동 일시정지)

/* ══════════════ HUD ══════════════ */
const $ = (id) => document.getElementById(id);
function updateHud() {
  const h = hole();
  const total = game.results.reduce((s, r) => s + (r.strokes - r.par), 0);
  const totalStr = total > 0 ? `+${total}` : total === 0 ? 'E' : `${total}`;
  const remain = Math.abs(h.holeX - game.ball.x);
  const lie = game.strokes === 0 ? 'tee' : surfaceAt(h, game.ball.x);
  $('scoreboard').innerHTML =
    `<div class="big">${game.holeIdx + 1}번 홀 · 파 ${h.par} · ${Math.round(h.dist)}m</div>` +
    `<div class="sub">타수 ${game.strokes} · 합계 ${totalStr} · ${SURFACES[lie].label} · 남은 거리 ${Math.round(remain)}m</div>`;
  const c = CLUBS[game.clubIdx];
  $('clubcard').innerHTML =
    `<div class="row"><span class="arrow">◀</span><span class="name">${c.name}</span><span class="arrow">▶</span></div>` +
    `<div class="spec">${CAT_LABEL[c.cat]}</div>`;
}
function showToast(title, sub) { $('toast').querySelector('.title').textContent = title; $('toast').querySelector('.sub').textContent = sub; $('toast').classList.add('show'); }
function hideToast() { $('toast').classList.remove('show'); }
function showScorecard() {
  const rows = game.results.map((r, i) =>
    `<tr><td>${i + 1}</td><td>${r.par}</td><td>${r.gaveUp ? '기권' : r.strokes}</td><td>${scoreName(r.strokes, r.par)}</td></tr>`).join('');
  const total = game.results.reduce((s, r) => s + (r.strokes - r.par), 0);
  const totalStr = total > 0 ? `+${total}` : total === 0 ? '이븐 파' : `${total}`;
  $('scorecard').innerHTML =
    `<h2>⛳️ 라운드 종료</h2><table><tr><th>홀</th><th>파</th><th>타수</th><th>결과</th></tr>${rows}</table>` +
    `<div class="total">합계 ${totalStr}</div><div class="restart">R 키로 새 라운드</div>`;
  $('scorecard').classList.add('show');
}
function hideScorecard() { $('scorecard').classList.remove('show'); }

/* ══════════════ 렌더링 ══════════════ */
const canvas = $('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, pxPerM = 1, groundY = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  groundY = H - 96;
}
window.addEventListener('resize', resize);
resize();

const mx = (m) => m * pxPerM;            // world m → px (x)
const my = (m) => groundY - m * pxPerM;  // world m → px (y, 표고 기준)
const gpxAt = (xm) => groundY - gAt(hole(), xm) * pxPerM; // 지형 표면의 화면 y

/* 지면 밴드 스타일 — 회색 그라데이션으로 라이 구분 (밝을수록 잘 다듬어진 잔디) */
const SURF_STYLE = {
  tee:     { color: 'rgba(214, 216, 218, 0.75)', width: 4 },
  fairway: { color: 'rgba(214, 216, 218, 0.75)', width: 4 },
  rough:   { color: 'rgba(120, 123, 126, 0.8)',  width: 9 },
  apron:   { color: 'rgba(238, 239, 240, 0.85)', width: 4 },
  green:   { color: 'rgba(255, 255, 255, 0.95)', width: 3 },
  bunker:  { color: 'rgba(199, 192, 175, 0.9)',  width: 6 }, // 모래: 살짝 따뜻한 회색
  water:   { color: 'rgba(128, 150, 168, 0.9)',  width: 5 }, // 물: 탈색된 청회색
};

/* 지형을 따라 폴리라인으로 지면 구간을 그린다 */
function drawGroundRange(from, to, style) {
  if (to - from < 0.1) return;
  ctx.strokeStyle = style.color;
  ctx.lineWidth = style.width;
  ctx.beginPath();
  const step = Math.max(2 / pxPerM, 0.5); // 화면 ~2px 간격 샘플
  ctx.moveTo(mx(from), gpxAt(from));
  for (let x = from + step; x < to; x += step) ctx.lineTo(mx(x), gpxAt(x));
  ctx.lineTo(mx(to), gpxAt(to));
  ctx.stroke();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const h = hole();
  pxPerM = W / h.worldW; // 홀마다 스케일이 다름 (실거리 반영)
  const b = game.ball;
  const cupPx = mx(h.holeX);
  const cupHalf = Math.max(mx(PHYS.cupHalfWidth), 5);

  // 지면: 지형을 따르는 라이별 폴리라인 (컵 구간은 끊김)
  ctx.lineCap = 'round';
  const cupHalfM = Math.max(PHYS.cupHalfWidth, 5 / pxPerM);
  const cupL = h.holeX - cupHalfM, cupR = h.holeX + cupHalfM;
  for (const seg of h.segments) {
    const st = SURF_STYLE[seg.type];
    if (seg.to <= cupL || seg.from >= cupR) {
      drawGroundRange(seg.from, seg.to, st);
    } else { // 컵을 포함하는 밴드는 둘로 쪼갬
      drawGroundRange(seg.from, Math.max(seg.from, cupL), st);
      drawGroundRange(Math.min(seg.to, cupR), seg.to, st);
    }
    if (seg.type === 'bunker') { // 모래 점 텍스처
      ctx.fillStyle = 'rgba(199, 192, 175, 0.55)';
      for (let x = seg.from + 1; x < seg.to; x += 1.7) {
        ctx.beginPath(); ctx.arc(mx(x), gpxAt(x) + 4, 1.1, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (seg.type === 'water') { // 물결 표시
      ctx.strokeStyle = 'rgba(128, 150, 168, 0.5)';
      ctx.lineWidth = 1.5;
      for (let x = seg.from + 2; x < seg.to - 2; x += 5) {
        ctx.beginPath();
        ctx.moveTo(mx(x), gpxAt(x) + 5);
        ctx.quadraticCurveTo(mx(x + 1.2), gpxAt(x) + 3, mx(x + 2.4), gpxAt(x) + 5);
        ctx.stroke();
      }
    }
  }

  // 컵 (그린 표고 위)
  const cupY = gpxAt(h.holeX);
  ctx.fillStyle = 'rgba(18, 19, 21, 0.9)';
  ctx.fillRect(cupPx - cupHalf, cupY, cupHalf * 2, 12);
  ctx.strokeStyle = 'rgba(238, 239, 240, 0.85)';
  ctx.lineWidth = 2;
  ctx.strokeRect(cupPx - cupHalf, cupY, cupHalf * 2, 12);

  // 깃발 (포인트 컬러)
  ctx.strokeStyle = 'rgba(232, 233, 234, 0.9)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cupPx, cupY); ctx.lineTo(cupPx, cupY - 58); ctx.stroke();
  ctx.fillStyle = ACCENT;
  ctx.beginPath();
  ctx.moveTo(cupPx, cupY - 58);
  ctx.quadraticCurveTo(cupPx + 20, cupY - 56, cupPx + 26, cupY - 50);
  ctx.quadraticCurveTo(cupPx + 20, cupY - 45, cupPx, cupY - 42);
  ctx.closePath(); ctx.fill();

  // 티 마커
  ctx.fillStyle = 'rgba(232, 233, 234, 0.45)';
  ctx.fillRect(mx(TEE_X) - 1.5, gpxAt(TEE_X) - 7, 3, 7);

  // 궤적 트레일
  if (game.trail.length > 1) {
    ctx.lineWidth = 1.5;
    for (let i = 1; i < game.trail.length; i++) {
      const p0 = game.trail[i - 1], p1 = game.trail[i];
      const a = Math.max(0, 1 - p1.age / 2.2) * 0.45;
      ctx.strokeStyle = `rgba(255, 255, 255, ${a})`;
      ctx.beginPath(); ctx.moveTo(mx(p0.x), my(p0.y)); ctx.lineTo(mx(p1.x), my(p1.y)); ctx.stroke();
    }
  }

  drawStickman();

  // 공 그림자 (높이 단서 — 지형 표면 위에)
  const heightAbove = b.y - gAt(h, b.x);
  if (heightAbove > 0.2) {
    const s = Math.max(2, 6 - heightAbove * 0.08);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.beginPath(); ctx.ellipse(mx(b.x), gpxAt(b.x) - 1, s * 1.6, s * 0.45, 0, 0, Math.PI * 2); ctx.fill();
  }

  // 공 (홀인 시 컵으로 낙하 연출)
  let ballY = my(b.y);
  if (game.mode === 'holed') { game.holedAnim = Math.min(1, game.holedAnim + 0.06); ballY = gpxAt(h.holeX) + 8 * game.holedAnim; }
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(mx(b.x), ballY - 6, 6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
  ctx.lineWidth = 1; ctx.stroke();
}

/* 부드러운 곡선 획 헬퍼: 시작→끝을 살짝 휜 곡선으로 */
function limb(x0, y0, x1, y1, bendX, bendY) {
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.quadraticCurveTo((x0 + x1) / 2 + bendX, (y0 + y1) / 2 + bendY, x1, y1);
  ctx.stroke();
}

function drawStickman() {
  // 걷는 동안(relax 이후)만 보행 리그, 그 외엔 스무딩된 렌더 포즈
  if (game.mode === 'walking' && game.walkAnim && game.walkAnim.t >= game.walkAnim.relax) {
    drawWalking();
    return;
  }
  drawPoseRig(game.renderPose || currentPose());
}

/* P-System 포즈 기반 렌더링: 척추 기울기·힙 이동(체중)·팔 접힘·뒷발꿈치까지
   키프레임에서 보간된 값으로 몸 전체를 그린다 */
function drawPoseRig(p) {
  const dir = game.stickDir;
  const ballPx = mx(game.stickX);
  const gy = gpxAt(game.stickX); // 지형 표고 위에 선다
  const px = ballPx - dir * game.renderBf;         // 스탠스 중심 (클럽별 공 위치, 스무딩됨)
  const hip = { x: px + dir * (p.hipDx - 5), y: gy - 42 };
  const shoulder = { x: hip.x + dir * (6 + 0.5 * p.tilt), y: gy - 66 };
  const head = { x: shoulder.x + dir * p.headDx, y: shoulder.y - 12 };
  const aH = (p.handA * Math.PI) / 180;
  const aC = (p.clubA * Math.PI) / 180;
  const hands = { x: shoulder.x + Math.sin(aH) * p.handD * dir, y: shoulder.y + Math.cos(aH) * p.handD };
  const clubLen = 31;
  const tip = { x: hands.x + Math.sin(aC) * clubLen * dir, y: hands.y + Math.cos(aC) * clubLen };

  ctx.strokeStyle = STICK;
  ctx.fillStyle = STICK;
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // 머리 (스윙의 시각 앵커 — 어깨를 따라 최소한만 이동)
  ctx.beginPath(); ctx.arc(head.x, head.y, 10, 0, Math.PI * 2); ctx.fill();
  // 척추: 기울기가 키프레임마다 변함 (리서치: 가장 중요한 개선점)
  limb(shoulder.x, shoulder.y, hip.x, hip.y, -dir * 3, 0);
  // 다리: 발 위치 고정, 힙 이동으로 체중 표현. 뒷발꿈치는 임팩트 이후 들림
  ctx.beginPath(); ctx.moveTo(hip.x, hip.y);
  ctx.quadraticCurveTo(px - dir * 13 + dir * p.hipDx * 0.5, gy - 22, px - dir * 16, gy - p.heel);
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hip.x, hip.y);
  ctx.quadraticCurveTo(px + dir * 6 + dir * p.hipDx * 0.5, gy - 21, px + dir * 11, gy);
  ctx.stroke();

  // 팔 두 개: 어깨→손 (handD가 줄면 접힌 느낌)
  ctx.lineWidth = 5.5;
  limb(shoulder.x, shoulder.y, hands.x, hands.y, dir * 2, -2);
  limb(shoulder.x, shoulder.y - 2.5, hands.x, hands.y, dir * 4, 0);

  // 샤프트 + 클럽헤드
  ctx.strokeStyle = 'rgba(190, 193, 196, 0.9)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(hands.x, hands.y); ctx.lineTo(tip.x, tip.y); ctx.stroke();
  drawClubHead(CLUBS[game.clubIdx].cat, tip, aC, dir);

  // 백스윙 % 라벨 (조준 중일 때만)
  if (game.mode === 'aim') {
    ctx.fillStyle = '#e8e9ea';
    ctx.font = '600 12px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`${Math.round(game.heightPct * 100)}%`, px, gy - 96);
  }
}

/* 걷기: 발이 지면에 붙었다 떨어지는 실제 보행.
   걸음 주기가 이동 속도에 물리적으로 연동되어(ω=v/보폭) 발이 미끄러지지 않고,
   출발·도착에서 이동이 느려지면 걸음도 자연히 잦아들며 멈춘다 */
function drawWalking() {
  const w = game.walkAnim;
  const dir = game.stickDir;
  const px = mx(game.stickX);
  const gy = gpxAt(game.stickX); // 지형 위를 걷는다
  const s1 = Math.sin(w.phase), c1 = Math.cos(w.phase);
  const vAmp = Math.min(1, w.vPx / 30);        // 속도 기반 강도: 발 들기·들썩임·팔 흔들림

  const bob = 1.6 * vAmp * Math.abs(c1);       // 스텝마다 몸이 살짝 들썩
  const hip = { x: px, y: gy - 45 - bob };
  const shoulder = { x: px + dir * (2 + 2.5 * vAmp), y: gy - 68 - bob }; // 걸을수록 앞으로 기울임
  const head = { x: shoulder.x + dir * 4, y: shoulder.y - 12 };

  ctx.strokeStyle = STICK;
  ctx.fillStyle = STICK;
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // 머리·척추
  ctx.beginPath(); ctx.arc(head.x, head.y, 10, 0, Math.PI * 2); ctx.fill();
  limb(shoulder.x, shoulder.y, hip.x, hip.y, -dir * 1.5, 0);

  // 다리: 지지발은 지면에 서 있고, 스윙발은 무릎을 들어 앞으로 내딛는다
  // (발이 앞으로 움직이는 반주기 동안만 들림 = max(0, ±cos)). 각 발은 밟는 지점의 표고를 따름
  const f1x = px + dir * WALK_STRIDE * s1;
  const f2x = px - dir * WALK_STRIDE * s1;
  const f1 = { x: f1x, y: gpxAt(f1x / pxPerM) - 7 * vAmp * Math.max(0, c1) };
  const f2 = { x: f2x, y: gpxAt(f2x / pxPerM) - 7 * vAmp * Math.max(0, -c1) };
  const k1 = { x: (hip.x + f1.x) / 2 + dir * 3, y: (hip.y + f1.y) / 2 - 3 - 6 * vAmp * Math.max(0, c1) };
  const k2 = { x: (hip.x + f2.x) / 2 + dir * 3, y: (hip.y + f2.y) / 2 - 3 - 6 * vAmp * Math.max(0, -c1) };
  ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.quadraticCurveTo(k1.x, k1.y, f1.x, f1.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.quadraticCurveTo(k2.x, k2.y, f2.x, f2.y); ctx.stroke();

  // 클럽 든 팔: 차분히 몸 뒤로. 자유 팔: 다리와 반대 위상으로 흔들림
  const grip = { x: px - dir * 12, y: gy - 51 - bob };
  ctx.lineWidth = 5.5;
  limb(shoulder.x, shoulder.y, grip.x, grip.y, -dir * 3, 2);
  limb(shoulder.x, shoulder.y, px + dir * (5 - 8 * s1 * vAmp), gy - 51 - bob, dir * 2, 3);

  // 클럽: 뒤로 비스듬히 든 채 이동
  const tip = { x: grip.x - dir * 16, y: gy - 13 - bob };
  ctx.strokeStyle = 'rgba(190, 193, 196, 0.9)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(grip.x, grip.y); ctx.lineTo(tip.x, tip.y); ctx.stroke();
  const carryPhi = Math.atan2((tip.x - grip.x) * dir, tip.y - grip.y);
  drawClubHead(CLUBS[game.clubIdx].cat, tip, carryPhi, dir);
}

/* 클럽 헤드 디자인 — 숫자 대신 생김새로 클럽을 구분한다 */
function drawClubHead(cat, tip, phi, dir) {
  const along = { x: Math.sin(phi) * dir, y: Math.cos(phi) };      // 샤프트 방향
  const perp = { x: Math.cos(phi) * dir, y: -Math.sin(phi) };     // 타격 방향(전방)
  ctx.save();
  ctx.strokeStyle = 'rgba(225, 227, 229, 0.95)';
  ctx.fillStyle = 'rgba(225, 227, 229, 0.95)';
  ctx.lineCap = 'round';

  if (cat === 'wood') {
    // 우드: 크고 둥근 덩어리 헤드
    ctx.beginPath();
    ctx.ellipse(tip.x + perp.x * 4, tip.y + perp.y * 4, 7.5, 5, Math.atan2(perp.y, perp.x), 0, Math.PI * 2);
    ctx.fill();
  } else if (cat === 'iron') {
    // 아이언: 얇은 블레이드
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(tip.x, tip.y);
    ctx.lineTo(tip.x + perp.x * 9 + along.x * 3, tip.y + perp.y * 9 + along.y * 3);
    ctx.stroke();
  } else if (cat === 'wedge') {
    // 웨지: 넓고 젖혀진 블레이드
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(tip.x, tip.y);
    ctx.lineTo(tip.x + perp.x * 10 - along.x * 5, tip.y + perp.y * 10 - along.y * 5);
    ctx.stroke();
  } else {
    // 퍼터: 납작한 블록
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(tip.x - perp.x * 3, tip.y - perp.y * 3);
    ctx.lineTo(tip.x + perp.x * 7, tip.y + perp.y * 7);
    ctx.stroke();
  }
  ctx.restore();
}

/* ══════════════ 메인 루프 (고정 물리 스텝) ══════════════ */
let last = performance.now(), acc = 0;
function frame(now) {
  const dtReal = Math.min((now - last) / 1000, 0.1);
  last = now;

  // 백스윙 높이 홀드 조절 (퍼터는 절반 속도로 정밀 조절)
  if (game.mode === 'aim') {
    const rate = CLUBS[game.clubIdx].putter ? 0.4 : 0.85;
    if (held.has('ArrowUp'))   { game.heightPct = Math.min(1, game.heightPct + rate * dtReal); }
    if (held.has('ArrowDown')) { game.heightPct = Math.max(0, game.heightPct - rate * dtReal); }
  }

  // 걷기: 피니시 풀기(relax) 후 공이 멈춘 자리까지 이동, 도착하면 조준 재개
  if (game.mode === 'walking' && game.walkAnim) {
    const w = game.walkAnim;
    w.t += dtReal;
    const tw = w.t - w.relax;
    if (tw >= 0) {
      const u = Math.min(1, tw / w.dur);
      game.stickX = w.from + (w.to - w.from) * smoothstep(u);
      // 실제 이동 속도(smoothstep 미분)에 걸음 주기를 물리적으로 연동:
      // ω = v/보폭반경 → 발이 지면에서 미끄러지지 않고, 출발·도착 시 걸음도 자연히 느려진다
      const vInst = (Math.abs(w.to - w.from) * 6 * u * (1 - u)) / w.dur; // m/s
      w.vPx = vInst * pxPerM;
      w.phase += (w.vPx / WALK_STRIDE) * dtReal;
      if (u >= 1) enterAim();
    }
  }

  // 스윙 애니메이션: 임팩트 순간에 공 발사, 팔로스루는 발사 후에도 이어짐
  if (game.swingAnim) {
    const a = game.swingAnim;
    a.t += dtReal;
    if (!a.launched && a.t >= a.prof.down) { a.launched = true; launchBall(); }
    if (a.t >= SWING.total) { game.lastFinishPose = finishPose(a.prof); game.swingAnim = null; }
  }

  // 포즈 스무딩: 렌더 포즈가 목표 포즈를 지수 감쇠로 추적 — 모든 상태 전환이 자동으로 부드러워진다
  {
    const target = currentPose();
    if (!game.renderPose) game.renderPose = { ...target };
    // 스윙 중엔 임팩트 타이밍이 뭉개지지 않게 빠르게, 그 외엔 여유 있게 따라감
    const rate = game.swingAnim ? 45 : game.mode === 'aim' ? 14 : 8;
    const k = 1 - Math.exp(-rate * dtReal);
    for (const key in target) game.renderPose[key] += (target[key] - game.renderPose[key]) * k;
    game.renderBf += (clubProfile().ballFwd - game.renderBf) * k;
  }

  if (game.mode === 'motion') {
    acc += dtReal * PHYS.timeScale;
    let result = game.ball.phase;
    while (acc >= DT) {
      acc -= DT;
      result = physicsStep(game.ball, DT);
      if (result === 'holed' || result === 'water') break;
    }
    game.trail.push({ x: game.ball.x, y: game.ball.y, age: 0 });
    if (game.trail.length > 400) game.trail.shift();

    if (result === 'holed') onHoled();
    else if (result === 'water') onWater();
    else if (game.ball.phase === 'rest') {
      if (game.strokes >= PHYS.maxStrokes) onGiveUp();
      else startWalk();
    }
    updateHud();
  }
  game.trail.forEach((p) => (p.age += dtReal));

  draw();
  requestAnimationFrame(frame);
}
